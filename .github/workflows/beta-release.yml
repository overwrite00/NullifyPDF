name: Build and Release NullifyPDF (Beta)

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies (includes spaCy models)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        run: pytest tests/ -v

      - name: Type Check (mypy)
        shell: bash
        run: mypy NullifyPDF.py pii_detection.py privacy_core.py update_check.py PDF_Checker.py

      - name: Resolve beta suffix from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "NULLIFYPDF_BETA_SUFFIX=${TAG#*-}" >> "$GITHUB_ENV"

      - name: Build
        run: python build_local.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: beta-build-${{ runner.os }}
          retention-days: 5
          path: |
            dist/NullifyPDF_v*_Windows.exe
            dist/NullifyPDF_v*_macOS.zip

  linux:
    name: Linux packages
    uses: ./.github/workflows/build-linux.yml
    with:
      artifact_prefix: beta-build
      is_beta: true
      retention_days: 5

  create_beta_release:
    name: Create GitHub Beta Release
    needs: [build, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-builds
          pattern: beta-build-*
          merge-multiple: true

      - name: Create release and upload assets sequentially
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          # Release body = the matching CHANGELOG section (shown by the in-app
          # update check); fall back to a generic text if it is empty.
          NOTES_FILE="$(mktemp)"
          if ! python3 scripts/extract_release_notes.py "$TAG" > "$NOTES_FILE"; then
            echo "NullifyPDF beta release (build from develop). Do not use in production." > "$NOTES_FILE"
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading/replacing assets."
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --prerelease --notes-file "$NOTES_FILE"
          fi

          # Uploaded one at a time (not via softprops/action-gh-release's
          # concurrent batch) because parallel uploads of these large
          # binaries (100-300MB each) were timing out with an opaque
          # "Error saving asset" and no per-file retry.
          shopt -s nullglob
          files=(
            all-builds/NullifyPDF_v*_Windows.exe
            all-builds/NullifyPDF_v*_macOS.zip
            all-builds/NullifyPDF_v*_Ubuntu.deb
            all-builds/NullifyPDF_v*_Fedora.rpm
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found to upload" >&2
            exit 1
          fi

          # A release must carry every platform package; never ship a partial one.
          for suffix in _Windows.exe _macOS.zip _Ubuntu.deb _Fedora.rpm; do
            ls all-builds/NullifyPDF_v*"$suffix" >/dev/null 2>&1 || { echo "Missing release asset *$suffix" >&2; exit 1; }
          done

          for f in "${files[@]}"; do
            echo "Uploading $f ..."
            attempt=1
            until gh release upload "$TAG" "$f" --repo "$REPO" --clobber; do
              if [ "$attempt" -ge 3 ]; then
                echo "Failed to upload $f after $attempt attempts" >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Retrying upload of $f (attempt $attempt)..."
              sleep 10
            done
          done
