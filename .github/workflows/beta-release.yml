name: Build and Release NullifyPDF (Beta)

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        variant: [lite, full]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm dpkg binutils libxcb-cursor0 libxkbcommon-x11-0 libegl1 desktop-file-utils

      - name: Install Python Dependencies (includes spaCy models)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        run: pytest tests/ -v

      - name: Type Check (mypy)
        shell: bash
        run: mypy NullifyPDF.py --ignore-missing-imports --no-error-summary 2>&1 | head -50 || true

      - name: Resolve beta suffix from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "NULLIFYPDF_BETA_SUFFIX=${TAG#*-}" >> "$GITHUB_ENV"

      - name: Build
        env:
          NULLIFYPDF_BUILD_VARIANT: ${{ matrix.variant }}
        run: python build_local.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: beta-build-${{ runner.os }}-${{ matrix.variant }}
          retention-days: 5
          path: |
            dist/NullifyPDF_v*_Windows_*.exe
            dist/NullifyPDF_v*_macOS_*.zip
            dist/NullifyPDF_v*_Ubuntu_*.deb
            dist/NullifyPDF_v*_Fedora_*.rpm

  create_beta_release:
    name: Create GitHub Beta Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-builds
          pattern: beta-build-*
          merge-multiple: true

      - name: Create release and upload assets sequentially
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          NOTES="NullifyPDF beta release (build from develop). Includes Lite and Full OCR variants. Do not use in production. If validation succeeds, this build will be promoted to stable without rebuilding."

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading/replacing assets."
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --prerelease --notes "$NOTES"
          fi

          # Uploaded one at a time (not via softprops/action-gh-release's
          # concurrent batch) because parallel uploads of these large
          # binaries (100-300MB each) were timing out with an opaque
          # "Error saving asset" and no per-file retry.
          shopt -s nullglob
          files=(
            all-builds/NullifyPDF_v*_Windows_*.exe
            all-builds/NullifyPDF_v*_macOS_*.zip
            all-builds/NullifyPDF_v*_Ubuntu_*.deb
            all-builds/NullifyPDF_v*_Fedora_*.rpm
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found to upload" >&2
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "Uploading $f ..."
            attempt=1
            until gh release upload "$TAG" "$f" --repo "$REPO" --clobber; do
              if [ "$attempt" -ge 3 ]; then
                echo "Failed to upload $f after $attempt attempts" >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Retrying upload of $f (attempt $attempt)..."
              sleep 10
            done
          done
