name: Test Build NullifyPDF

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip' # CACHE RIPRISTINATA!

      - name: Install Python Dependencies (includes spaCy models)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        run: pytest tests/ -v

      - name: Type Check (mypy)
        shell: bash
        run: mypy NullifyPDF.py pii_detection.py privacy_core.py update_check.py PDF_Checker.py

      - name: Build
        run: python build_local.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-build-${{ runner.os }}
          path: |
            dist/NullifyPDF_v*_Windows.exe
            dist/NullifyPDF_v*_macOS.zip
          retention-days: 3

  linux:
    name: Linux packages
    uses: ./.github/workflows/build-linux.yml
    with:
      artifact_prefix: test-build
      is_beta: false
      retention_days: 3
