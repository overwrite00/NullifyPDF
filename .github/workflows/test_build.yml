name: Test Build NullifyPDF

on:
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    # Develop pull requests and the weekly run only need the canary below.
    if: github.event_name != 'schedule' && github.base_ref != 'develop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip' # CACHE RIPRISTINATA!

      - name: Install Python Dependencies (includes spaCy models)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The spaCy models come from github.com release assets, which
          # occasionally answer 504: retry instead of failing the release.
          for attempt in 1 2 3 4 5; do
            pip install -r requirements.txt && exit 0
            echo "Attempt $attempt failed, retrying in 30s..."; sleep 30
          done
          exit 1

      - name: Run Smoke Tests
        run: pytest tests/ -v

      - name: Type Check (mypy)
        shell: bash
        run: mypy NullifyPDF.py pii_detection.py privacy_core.py update_check.py PDF_Checker.py export_engine.py pdf_sanitize.py review_dialog.py lexicon_it.py secure_store.py word_lists.py dictionary_dialog.py

      - name: Build
        run: python build_local.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-build-${{ runner.os }}
          path: |
            dist/NullifyPDF_v*_Windows.exe
            dist/NullifyPDF_v*_macOS.zip
          retention-days: 3

  linux:
    name: Linux packages
    if: github.event_name != 'schedule' && github.base_ref != 'develop'
    uses: ./.github/workflows/build-linux.yml
    with:
      artifact_prefix: test-build
      is_beta: false
      retention_days: 3

  pymupdf-latest:
    # Redaction semantics (the glyph-deletion core, word boxes) differ between
    # PyMuPDF releases; this job reports early when a newer release changes
    # them. It never fails the workflow: it raises a visible warning.
    name: Tests against the latest PyMuPDF
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            pip install -r requirements.txt && break
            [ "$attempt" = 5 ] && exit 1
            echo "Attempt $attempt failed, retrying in 30s..."; sleep 30
          done
          pip install --upgrade pymupdf
          python -c "import pymupdf; print(pymupdf.VersionBind, pymupdf.VersionFitz)" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose exit status per test (temporary)
        shell: bash {0}
        run: |
          pytest tests/test_gui_flow.py --collect-only -q 2>/dev/null | grep "::" > ids.txt
          wc -l ids.txt
          while read -r t; do
            pytest "$t" -q >/dev/null 2>&1; rc=$?
            echo "GUI rc=$rc $t"
          done < ids.txt
          echo "diagnosis finished"
