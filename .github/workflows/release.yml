name: Build and Release NullifyPDF (Stable)

# The stable release is compiled from its own tag (not promoted from a beta):
# the app embeds its version string at build time, so re-labelling a beta
# build would leave "-beta.N" in the About dialog.

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta.*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Verify CHANGELOG entry
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify CHANGELOG has an entry for this version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          if ! grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' heading. On develop, move the [Unreleased] content under this heading before tagging the stable release."
            exit 1
          fi

          UNRELEASED_BODY=$(awk '/^## \[Unreleased\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -n "$UNRELEASED_BODY" ]; then
            echo "::error::CHANGELOG.md still has content under [Unreleased] that hasn't been moved to [$VERSION]. Update it on develop first."
            exit 1
          fi

          echo "[OK] CHANGELOG.md has a clean [$VERSION] entry and an empty [Unreleased] section."

      - name: Verify the app version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BASE=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' NullifyPDF.py)
          PRE=$(sed -nE 's/^__version_prerelease__ = "([^"]*)".*/\1/p' NullifyPDF.py)
          if [ "$BASE" != "$VERSION" ] || [ -n "$PRE" ]; then
            echo "::error::NullifyPDF.py declares version '$BASE' with prerelease '$PRE', but the stable tag is '$VERSION'. Set __version__ to $VERSION and __version_prerelease__ to \"\" before tagging."
            exit 1
          fi
          echo "[OK] NullifyPDF.py declares stable version $VERSION."

  build:
    name: Build for ${{ matrix.os }}
    needs: changelog
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies (includes spaCy models)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The spaCy models come from github.com release assets, which
          # occasionally answer 504: retry instead of failing the release.
          for attempt in 1 2 3 4 5; do
            pip install -r requirements.txt && exit 0
            echo "Attempt $attempt failed, retrying in 30s..."; sleep 30
          done
          exit 1

      - name: Run Smoke Tests
        run: pytest tests/ -v

      - name: Type Check (mypy)
        shell: bash
        run: mypy NullifyPDF.py pii_detection.py privacy_core.py update_check.py PDF_Checker.py export_engine.py pdf_sanitize.py review_dialog.py lexicon_it.py secure_store.py word_lists.py dictionary_dialog.py

      - name: Build
        run: python build_local.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: stable-build-${{ runner.os }}
          retention-days: 5
          path: |
            dist/NullifyPDF_v*_Windows.exe
            dist/NullifyPDF_v*_macOS.zip

  linux:
    name: Linux packages
    needs: changelog
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build-linux.yml
    with:
      artifact_prefix: stable-build
      is_beta: false
      retention_days: 5

  create_release:
    name: Create GitHub Stable Release
    needs: [build, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-builds
          pattern: stable-build-*
          merge-multiple: true

      - name: Create release and upload assets sequentially
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          # Release body = the matching CHANGELOG section (shown by the in-app
          # update check); fall back to a generic text if it is empty.
          NOTES_FILE="$(mktemp)"
          if ! python3 scripts/extract_release_notes.py "$TAG" > "$NOTES_FILE"; then
            echo "NullifyPDF stable release. Available for Windows, macOS, and Linux. See CHANGELOG.md for the changes in this version." > "$NOTES_FILE"
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading/replacing assets."
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file "$NOTES_FILE"
          fi

          # Uploaded one at a time, not via softprops/action-gh-release's
          # concurrent batch: parallel uploads of these large binaries
          # (100-300MB each) were timing out with an opaque "Error saving
          # asset" and no per-file retry (see beta-release.yml).
          shopt -s nullglob
          files=(
            all-builds/NullifyPDF_v*_Windows.exe
            all-builds/NullifyPDF_v*_macOS.zip
            all-builds/NullifyPDF_v*_Ubuntu.deb
            all-builds/NullifyPDF_v*_Fedora.rpm
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found to upload" >&2
            exit 1
          fi

          # A release must carry every platform package; never ship a partial one.
          for suffix in _Windows.exe _macOS.zip _Ubuntu.deb _Fedora.rpm; do
            ls all-builds/NullifyPDF_v*"$suffix" >/dev/null 2>&1 || { echo "Missing release asset *$suffix" >&2; exit 1; }
          done

          for f in "${files[@]}"; do
            echo "Uploading $f ..."
            attempt=1
            until gh release upload "$TAG" "$f" --repo "$REPO" --clobber; do
              if [ "$attempt" -ge 3 ]; then
                echo "Failed to upload $f after $attempt attempts" >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Retrying upload of $f (attempt $attempt)..."
              sleep 10
            done
          done
