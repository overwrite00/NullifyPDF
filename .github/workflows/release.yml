name: Promote Beta to Stable Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta.*'
  workflow_dispatch:
    inputs:
      beta_tag:
        description: 'Beta tag to promote (leave empty to auto-select the latest beta)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote latest beta artifacts to stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify CHANGELOG has an entry for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          if ! grep -qE "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - YYYY-MM-DD' heading. On develop, move the [Unreleased] content under this heading before tagging the stable release."
            exit 1
          fi

          UNRELEASED_BODY=$(awk '/^## \[Unreleased\]/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          if [ -n "$UNRELEASED_BODY" ]; then
            echo "::error::CHANGELOG.md still has content under [Unreleased] that hasn't been moved to [$VERSION]. Update it on develop first."
            exit 1
          fi

          echo "[OK] CHANGELOG.md has a clean [$VERSION] entry and an empty [Unreleased] section."

      - name: Resolve target beta release
        id: beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_TAG_INPUT: ${{ github.event.inputs.beta_tag }}
        run: |
          if [ -n "$BETA_TAG_INPUT" ]; then
            TAG="$BETA_TAG_INPUT"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease == true)] | sort_by(.createdAt) | last | .tagName // empty')
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No beta release found to promote. Publish a beta release first (tag v*-beta.*) or pass beta_tag explicitly."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting beta release: $TAG"

      - name: Download beta release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stable-assets
          gh release download "${{ steps.beta.outputs.tag }}" --repo "${{ github.repository }}" --dir stable-assets \
            --pattern "NullifyPDF_v*_Windows_*.exe" \
            --pattern "NullifyPDF_v*_macOS_*.zip" \
            --pattern "NullifyPDF_v*_Ubuntu_*.deb" \
            --pattern "NullifyPDF_v*_Fedora_*.rpm"

      - name: Strip beta suffix from filenames
        run: |
          cd stable-assets
          for f in *; do
            new="$(echo "$f" | sed -E 's/-beta\.[0-9]+//')"
            if [ "$f" != "$new" ]; then
              mv "$f" "$new"
            fi
          done
          ls -la

      - name: Create Stable Release
        uses: softprops/action-gh-release@v3
        with:
          files: stable-assets/*
          prerelease: false
          body: |
            NullifyPDF stable release.
            Promoted from beta `${{ steps.beta.outputs.tag }}` (already verified build, no rebuild).
            Includes Lite and Full OCR variants for Windows, macOS, and Linux.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
