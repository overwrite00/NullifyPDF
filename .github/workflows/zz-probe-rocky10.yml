name: probe rocky10
on:
  push:
    branches: ["ci/probe-rocky10"]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-build-Linux-rpm
          run-id: 42473920947
          github-token: ${{ github.token }}
          path: pkgs
      - name: Tools
        run: dnf install -y -q xwayland-run mutter dbus-daemon xorg-x11-xauth --allowerasing 2>&1 | tail -5; which xwfb-run mutter
      - name: Install
        run: dnf install -y -q ./pkgs/*.rpm 2>&1 | tail -5
      - name: Run
        run: |
          set +e
          timeout 90 xwfb-run -c mutter -- sh -c 'echo "DISPLAY=$DISPLAY"; QT_QPA_PLATFORM=xcb timeout 45 /usr/bin/nullify-pdf; echo "app rc=$?"' > /tmp/app.log 2>&1
          echo "rc=$?"; cat /tmp/app.log
